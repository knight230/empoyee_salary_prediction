<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Salary Prediction</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="icon-badge">💼</div>
      <h1>Employee Salary Predictor</h1>
      <p class="subtitle">AI-powered salary estimation using Machine Learning</p>
    </div>

    <form id="salaryForm">
      <div class="field">
        <label for="experience">📊 Years of Experience</label>
        <input type="number" id="experience" min="0" max="40" step="1" placeholder="e.g. 5" required>
      </div>

      <div class="field">
        <label for="education">🎓 Education Level</label>
        <select id="education" required></select>
      </div>

      <div class="field">
        <label for="jobRole">💻 Job Role</label>
        <select id="jobRole" required></select>
      </div>

      <div class="field">
        <label for="city">📍 City</label>
        <select id="city" required></select>
      </div>

      <button type="submit" id="submitBtn">
        <span id="btnText">Predict Salary</span>
      </button>
    </form>

    <div id="result" class="result hidden">
      <p class="result-label">Predicted Monthly Salary</p>
      <p class="result-amount" id="resultAmount">₹0</p>
    </div>

    <div id="error" class="error hidden"></div>

    <p class="footer-note">Powered by scikit-learn Linear Regression Model</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
